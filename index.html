<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brushify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        <h1 style="text-decoration: underline;">Brushify</h1>
        <div id="box"contenteditable="true"></div>
        <br>
        <button id="dwd-btn">Download</button>
        <br><br>
        <div id="second">
        <div id="second-box">
        <div id="bg-color">
                <h2>Choose your background color</h2>
                <button onclick="changeBackgroundColor('red')" style="background-color:red;"></button>
                <button onclick="changeBackgroundColor('hotpink')" style="background-color:rgb(178, 55, 117);"></button>
                <button onclick="changeBackgroundColor('rosered')" style="background-color:rgb(89, 3, 3);"></button>
                <button onclick="changeBackgroundColor('yellow')" style="background-color:yellow;"></button>
                <button onclick="changeBackgroundColor('purple')" style="background-color:purple;"></button>
                <button onclick="changeBackgroundColor('pink')" style="background-color:pink;"></button>
                <button onclick="changeBackgroundColor('orange')" style="background-color:orange;"></button>
                <button onclick="changeBackgroundColor('aliceblue')" style="background-color:aliceblue;"></button>
                <button onclick="changeBackgroundColor('darkkhaki')" style="background-color:darkkhaki;"></button>
                <button onclick="changeBackgroundColor('aquamarine')" style="background-color:aquamarine;"></button>
                <button onclick="changeBackgroundColor('magenta')" style="background-color:magenta;"></button>
                <button onclick="changeBackgroundColor('green')" style="background-color:green;"></button>
                <button onclick="changeBackgroundColor('blue')" style="background-color:blue;"></button>
                <button onclick="changeBackgroundColor('teal')" style="background-color:teal;"></button>
                <button onclick="changeBackgroundColor('mediumpurple')" style="background-color:mediumpurple;"></button>
                <button onclick="changeBackgroundColor('greenyellow')" style="background-color:greenyellow;"></button>
                <button onclick="changeBackgroundColor('salmon')" style="background-color:salmon;"></button>
                <button onclick="changeBackgroundColor('Aqua')" style="background-color:aqua;"></button>
                <button onclick="changeBackgroundColor('gray')" style="background-color:gray;"></button>
                <button onclick="changeBackgroundColor('palevioletred')" style="background-color:palevioletred;"></button>
            </div></div>
            <div id="second-box">
            <div id="text-color">
                <h2>Choose your text color</h2>
                <button onclick="changeTextColor('red')" style="background-color:red;"></button>
                <button onclick="changeTextColor('hotpink')" style="background-color:rgb(178, 55, 117);"></button>
                <button onclick="changeTextColor('blue')" style="background-color:blue;"></button>
                <button onclick="changeTextColor('yellow')" style="background-color:yellow;"></button>
                <button onclick="changeTextColor('purple')" style="background-color:purple;"></button>
                <button onclick="changeTextColor('aquamarine')" style="background-color:aquamarine;"></button>
                <button onclick="changeTextColor('orange')" style="background-color:orange;"></button>
                <button onclick="changeTextColor('black')" style="background-color:black;"></button>
                <button onclick="changeTextColor('gray')" style="background-color:gray;"></button>
                <button onclick="changeTextColor('white')" style="background-color:white;"></button>
                <button onclick="changeTextColor('magenta')" style="background-color:magenta;"></button>
                <button onclick="changeTextColor('green')" style="background-color:green;"></button>
                <button onclick="changeTextColor('olive')" style="background-color:olive;"></button>
                <button onclick="changeTextColor('silver')" style="background-color:silver;"></button>
                <button onclick="changeTextColor('salmon')" style="background-color:salmon;"></button>
                <button onclick="changeTextColor('pink')" style="background-color:pink;"></button>
                <button onclick="changeTextColor('aqua')" style="background-color:aqua;"></button>
                <button onclick="changeTextColor('palevioletred')" style="background-color:palevioletred;"></button>
                <button onclick="changeTextColor('mediumpurple')" style="background-color:mediumpurple;"></button>
                <button onclick="changeTextColor('teal')" style="background-color:teal;"></button>
            </div></div>
            <div id="second-box">
            <div id="fonts">
                <h2>Choose your font style</h2>
                <button onclick="changefontfamily('cursive')">Cursive</button>
                <button onclick="changefontfamily('serif')">Serif</button>
                <button onclick="changefontfamily('sans-serif')">Sans</button>
                <button onclick="changefontfamily('monospace')">Mono</button>
                <button onclick="changefontfamily('fantasy')">Fantasy</button><br><br>
                <button onclick="changefontfamily('arial')">Arial</button>
                <button onclick="changefontfamily('tahoma')">Tahoma</button>
                <button onclick="changefontfamily('helvetica')">Helvetica</button>
                <button onclick="changefontfamily('palatino')">Palatino</button>
                <button onclick="changefontfamily('courier')">Courier</button>
            </div></div>
        </div>
    </center>
   <script>
        function changeBackgroundColor(clr) {
            document.getElementById("box").style.backgroundColor=clr;
        }
        function changeTextColor(clr) {
            document.getElementById("box").style.color=clr;
        }
        function changefontfamily(font) {
            document.getElementById("box").style.fontFamily=font;
        }
    </script>
</body>
</html>
